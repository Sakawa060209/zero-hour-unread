<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081116">
  <meta name="description" content="《塞壬号：第七幕没有掌声》——高难度海上密室文字推理游戏。调查一间会移动的密室，拆穿六名嫌疑人的谎言。">
  <title>塞壬号：第七幕没有掌声</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2.3.0">
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <div class="sea-haze" aria-hidden="true"></div>

  <header class="topbar" id="topbar" hidden>
    <button class="wordmark" id="homeBtn" aria-label="打开调查菜单">
      <span class="wordmark-mark">塞</span>
      <span><b>塞壬号</b><small>THE SEVENTH ACT</small></span>
    </button>
    <div class="case-clock" aria-label="当前调查状态">
      <span class="pulse-dot"></span>
      <span id="chapterLabel">序章</span>
      <span class="clock-divider">/</span>
      <span id="timeLabel">00:54</span>
    </div>
    <nav class="tools" aria-label="调查工具">
      <button class="tool-button" id="clueBtn"><span class="desktop-tool-label">案卷</span><span class="mobile-tool-label">卷</span><b id="clueCount">0</b></button>
      <button class="tool-button icon-only" id="soundBtn" aria-label="开启环境音" title="环境音">♬</button>
      <button class="tool-button icon-only" id="saveBtn" aria-label="保存进度" title="保存进度">◆</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog class="notebook" id="notebook">
    <div class="notebook-head">
      <div>
        <p class="eyebrow dark">INVESTIGATION FILE · SIREN</p>
        <h2>调查案卷</h2>
      </div>
      <button class="close-button" id="closeNotebook" aria-label="关闭案卷">×</button>
    </div>
    <div class="notebook-tabs" role="tablist">
      <button class="active" data-notebook-tab="clues">线索</button>
      <button data-notebook-tab="chains">证据链</button>
      <button data-notebook-tab="people">人物</button>
      <button data-notebook-tab="timeline">时间线</button>
    </div>
    <div class="notebook-body" id="notebookBody"></div>
  </dialog>

  <dialog class="pause-menu" id="pauseMenu">
    <div class="pause-panel">
      <p class="eyebrow">INVESTIGATION PAUSED</p>
      <h2>调查菜单</h2>
      <p id="pauseChapter" class="muted"></p>
      <div class="pause-actions">
        <button class="btn" id="resumeBtn">继续调查</button>
        <button class="btn secondary" id="pauseClueBtn">打开案卷</button>
        <button class="btn secondary" id="pauseSaveBtn">保存进度</button>
        <button class="btn secondary" id="titleBtn">返回标题</button>
        <button class="btn danger" id="restartBtn">重新开始</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>本游戏需要启用 JavaScript。</noscript>
  <script src="game.js?v=2.3.0"></script>
</body>
</html>
